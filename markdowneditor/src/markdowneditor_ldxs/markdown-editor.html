<style>
  :root{
    --bg:#1a1a1c; --panel:#212124; --editor-bg:#1e1e20; --preview-bg:#1a1a1c;
    --text:#e6e6e8; --muted:#8a8a90; --border:#33333a; --accent:#7aa2f7;
    --accent-soft:rgba(122,162,247,.14); --code-bg:#2a2a30; --shadow:0 2px 12px rgba(0,0,0,.4);
    --quote-border:#3a3a44; --table-border:#3a3a44; --radius:10px;
    --mono:Consolas,Menlo,Monaco,"Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  body.light{
    --bg:#f7f6f3; --panel:#ffffff; --editor-bg:#fbfaf8; --preview-bg:#f7f6f3;
    --text:#2b2b2e; --muted:#9a978f; --border:#e6e3dc; --accent:#4a6cf7;
    --accent-soft:rgba(74,108,247,.10); --code-bg:#f0eee9; --shadow:0 2px 12px rgba(0,0,0,.06);
    --quote-border:#d8d4cb; --table-border:#e0ddd5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:15px; line-height:1.7;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #toolbar{
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--border);
    flex:0 0 auto; user-select:none;
  }
  .tb-group{display:flex; align-items:center; gap:4px;}
  .tb-group.right{margin-left:auto;}
  .brand{font-weight:600; letter-spacing:.5px; color:var(--accent); margin-right:8px; font-size:14px;}
  .tb-btn{
    background:transparent; color:var(--text); border:1px solid transparent;
    border-radius:7px; padding:5px 10px; font-size:13px; cursor:pointer;
    font-family:var(--sans); transition:background .15s,border-color .15s;
  }
  .tb-btn:hover{background:var(--accent-soft);}
  .tb-btn.active{background:var(--accent-soft); border-color:var(--accent);}
  #main{flex:1 1 auto; display:flex; min-height:0;}
  .pane{min-height:0; overflow:auto;}
  #outline{
    flex:0 0 220px; border-right:1px solid var(--border);
    padding:14px 10px; background:var(--panel); font-size:13px;
  }
  #outline.hidden{display:none;}
  #outline h4{margin:0 0 8px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px;}
  #outline .ol-item{
    padding:3px 6px; border-radius:6px; cursor:pointer; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #outline .ol-item:hover{background:var(--accent-soft); color:var(--text);}
  #outline .lvl-1{padding-left:6px; font-weight:600; color:var(--text);}
  #outline .lvl-2{padding-left:18px;}
  #outline .lvl-3{padding-left:30px; font-size:12px;}
  #editorPane{flex:1 1 0; border-right:1px solid var(--border);}
  #previewPane{flex:1 1 0;}
  #editor{
    display:block; width:100%; height:100%; border:none; outline:none; resize:none;
    background:var(--editor-bg); color:var(--text);
    font-family:var(--mono); font-size:14px; line-height:1.8;
    padding:24px 28px; tab-size:2;
  }
  #preview{padding:24px 32px; max-width:820px; margin:0 auto;}
  body.view-edit #previewPane{display:none;}
  body.view-edit #editorPane{border-right:none;}
  body.view-preview #editorPane{display:none;}
  body.view-preview #outline{border-right:1px solid var(--border);}
  body.view-preview #previewPane{border-right:none;}
  #status{
    flex:0 0 auto; display:flex; gap:18px; align-items:center;
    padding:5px 16px; font-size:12px; color:var(--muted);
    background:var(--panel); border-top:1px solid var(--border);
  }
  #status .saved{margin-left:auto; color:#5fae7a;}
  #status .dirty{margin-left:auto; color:#d99a4e;}

  /* rendered markdown */
  .markdown-body{color:var(--text); word-wrap:break-word;}
  .markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6{
    line-height:1.35; margin:1.4em 0 .6em; font-weight:650;
  }
  .markdown-body h1{font-size:1.9em; border-bottom:1px solid var(--border); padding-bottom:.3em;}
  .markdown-body h2{font-size:1.5em; border-bottom:1px solid var(--border); padding-bottom:.25em;}
  .markdown-body h3{font-size:1.25em;}
  .markdown-body h4{font-size:1.08em;}
  .markdown-body p{margin:.85em 0;}
  .markdown-body a{color:var(--accent); text-decoration:none;}
  .markdown-body a:hover{text-decoration:underline;}
  .markdown-body strong{font-weight:700;}
  .markdown-body em{font-style:italic;}
  .markdown-body del{opacity:.6;}
  .markdown-body code{
    font-family:var(--mono); font-size:.88em; background:var(--code-bg);
    padding:.15em .4em; border-radius:5px;
  }
  .markdown-body pre{
    background:var(--code-bg); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; overflow:auto; margin:.9em 0;
  }
  .markdown-body pre code{background:none; padding:0; font-size:.85em; line-height:1.6;}
  .markdown-body blockquote{
    margin:.9em 0; padding:.4em 1em; border-left:3px solid var(--accent);
    background:var(--accent-soft); border-radius:0 var(--radius) var(--radius) 0; color:var(--text);
  }
  .markdown-body blockquote p{margin:.4em 0;}
  .markdown-body ul,.markdown-body ol{margin:.7em 0; padding-left:1.6em;}
  .markdown-body li{margin:.3em 0;}
  .markdown-body li.task{list-style:none; margin-left:-1.4em;}
  .markdown-body li.task input{margin-right:.5em; vertical-align:middle;}
  .markdown-body hr{border:none; border-top:1px solid var(--border); margin:1.6em 0;}
  .markdown-body table{
    border-collapse:collapse; margin:1em 0; width:100%; font-size:.93em;
  }
  .markdown-body th,.markdown-body td{
    border:1px solid var(--table-border); padding:7px 12px; text-align:left;
  }
  .markdown-body th{background:var(--code-bg); font-weight:650;}
  .markdown-body img{max-width:100%; border-radius:var(--radius); margin:.5em 0;}
  .markdown-body .toc-anchor{color:var(--muted);}

  @media print{
    #toolbar,#status,#outline,#editorPane{display:none !important;}
    #main{display:block;}
    #previewPane{display:block !important; overflow:visible;}
    body,html{overflow:visible; background:#fff; color:#000;}
    .markdown-body{color:#000; max-width:none;}
    .markdown-body pre,.markdown-body code{background:#f4f4f4; color:#000;}
  }

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s){
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function sanitizeUrl(u){
  var t=u.trim();
  if(/^(javascript|vbscript):/i.test(t)) return '#';
  if(/^data:/.test(t) && !/^data:image\//i.test(t)) return '#';
  return t;
}
function parseInline(text){
  var codes=[];
  text=text.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return '@@C'+(codes.length-1)+'@@';});
  text=escapeHtml(text);
  /* 生成的标签先进占位符：后续强调/加粗等行内语法绝不能触碰属性值
     （否则下划线文件名 20261015_181923_3419.png 会被 _.._ 改写成 <em>，图片必 404）。
     链接只占位开标签，链接文字仍参与行内格式化。 */
  var toks=[];
  text=text.replace(/!\[([^\]]*)\]\(([^)]+?)(?:\s+"([^"]*)")?\)/g,function(m,alt,src,title){
    toks.push('<img src="'+escAttr(src)+'" alt="'+escAttr(alt)+'"'+(title?' title="'+escAttr(title)+'"':'')+'>');
    return '\x00T'+(toks.length-1)+'\x00';
  });
  text=text.replace(/\[([^\]]+)\]\(([^)]+?)(?:\s+"([^"]*)")?\)/g,function(m,txt,href,title){
    toks.push('<a href="'+escAttr(sanitizeUrl(href))+'"'+(title?' title="'+escAttr(title)+'"':'')+' target="_blank" rel="noopener">');
    return '\x00T'+(toks.length-1)+'\x00'+txt+'</a>';
  });
  text=text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  text=text.replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>');
  text=text.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  text=text.replace(/@@C([0-9]+)@@/g,function(m,i){return '<code>'+escapeHtml(codes[+i])+'</code>';});
  text=text.replace(/\x00T(\d+)\x00/g,function(m,i){return toks[+i];});
  return text;
}
function parseList(lines,start,indent){
  var items=[];
  var i=start;
  var cur=null;
  while(i<lines.length){
    var line=lines[i];
    var m=line.match(/^([ ]*)([-*+]|[0-9]+\.)([ ]+)(.*)$/);
    if(!m){break;}
    var li=m[1].length;
    if(li<indent){break;}
    if(li>indent){
      if(cur!==null){
        var r=parseList(lines,i,li);
        cur.children+=r[0];
        i=r[1];
        continue;
      } else {break;}
    }
    var ordered=/[0-9]+\./.test(m[2]);
    cur={raw:m[4],ordered:ordered,children:''};
    items.push(cur);
    i++;
  }
  if(items.length===0){return ['',i];}
  var ordered0=items[0].ordered;
  var html=ordered0?'<ol>':'<ul>';
  for(var k=0;k<items.length;k++){
    var it=items[k];
    var tm=it.raw.match(/^\[([ xX])\][ ]+(.*)$/);
    if(tm){
      var checked=tm[1].toLowerCase()==='x';
      html+='<li class="task"><input type="checkbox" disabled'+(checked?' checked':'')+'> '+parseInline(tm[2])+it.children+'</li>';
    } else {
      html+='<li>'+parseInline(it.raw)+it.children+'</li>';
    }
  }
  html+=ordered0?'</ol>':'</ul>';
  return [html,i];
}
function splitRow(r){
  var arr=r.split('|').map(function(s){return s.trim();});
  if(arr.length>0 && arr[0]===''){arr.shift();}
  if(arr.length>0 && arr[arr.length-1]===''){arr.pop();}
  return arr;
}
function parseTable(lines,start){
  var head=splitRow(lines[start]);
  var sep=splitRow(lines[start+1]);
  var aligns=sep.map(function(c){
    var l=c.charAt(0)===':', r=c.charAt(c.length-1)===':';
    if(l&&r){return 'center';}
    if(r){return 'right';}
    if(l){return 'left';}
    return '';
  });
  var i=start+2;
  var body='';
  while(i<lines.length && lines[i].indexOf('|')>=0 && !/^[ ]*$/.test(lines[i])){
    var cells=splitRow(lines[i]);
    body+='<tr>'+cells.map(function(c,ci){
      return '<td'+(aligns[ci]?' style="text-align:'+aligns[ci]+'"':'')+'>'+parseInline(c)+'</td>';
    }).join('')+'</tr>';
    i++;
  }
  var thead='<thead><tr>'+head.map(function(c,ci){
    return '<th'+(aligns[ci]?' style="text-align:'+aligns[ci]+'"':'')+'>'+parseInline(c)+'</th>';
  }).join('')+'</tr></thead>';
  return ['<table>'+thead+'<tbody>'+body+'</tbody></table>',i];
}
function parseMarkdown(src){
  var lines=src.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  var html='';
  var i=0;
  while(i<lines.length){
    var line=lines[i];
    if(/^```/.test(line)){
      var lang=line.slice(3).trim();
      i++;
      var code='';
      while(i<lines.length && !/^```/.test(lines[i])){code+=lines[i]+'\n';i++;}
      i++;
      html+='<pre><code'+(lang?' class="lang-'+lang+'"':'')+'>'+escapeHtml(code.replace(/\n$/,'')).replace(/</g,'&lt;')+'</code></pre>';
      continue;
    }
    if(/^[ ]*$/.test(line)){i++;continue;}
    var hm=line.match(/^(#{1,6})[ ]+(.*)$/);
    if(hm){
      var lvl=hm[1].length;
      html+='<h'+lvl+'>'+parseInline(hm[2].trim())+'</h'+lvl+'>';
      i++;continue;
    }
    var stripped=line.replace(/[ ]/g,'');
    if(stripped.length>=3){
      var ch0=stripped.charAt(0);
      var allSame=true;
      for(var z=0;z<stripped.length;z++){if(stripped.charAt(z)!==ch0){allSame=false;break;}}
      if(allSame){html+='<hr>';i++;continue;}
    }
    if(/^[ ]*>/.test(line)){
      var quote=[];
      while(i<lines.length && /^[ ]*>/.test(lines[i])){quote.push(lines[i].replace(/^[ ]*>[ ]?/,''));i++;}
      html+='<blockquote>'+parseMarkdown(quote.join('\n'))+'</blockquote>';
      continue;
    }
    if(line.indexOf('|')>=0 && i+1<lines.length && /^[ ]*\|?[-|: ]+\|?[ ]*$/.test(lines[i+1]) && lines[i+1].indexOf('-')>=0){
      var t=parseTable(lines,i);
      html+=t[0];i=t[1];continue;
    }
    if(/^[ ]*([-*+]|[0-9]+\.)[ ]+/.test(line)){
      var ind=/^([ ]*)([-*+]|[0-9]+\.)/.exec(line)[1].length;
      var lst=parseList(lines,i,ind);
      html+=lst[0];i=lst[1];continue;
    }
    var para=[];
    while(i<lines.length && !/^[ ]*$/.test(lines[i]) && !/^```/.test(lines[i]) && !/^(#{1,6})[ ]+/.test(lines[i]) && !/^[ ]*>/.test(lines[i]) && !/^[ ]*([-*+]|[0-9]+\.)[ ]+/.test(lines[i]) && !(lines[i].indexOf('|')>=0 && i+1<lines.length && /^[ ]*\|?[-|: ]+\|?[ ]*$/.test(lines[i+1]) && lines[i+1].indexOf('-')>=0)){
      para.push(lines[i]);i++;
    }
    html+='<p>'+parseInline(para.join('\n')).replace(/\n/g,'<br>')+'</p>';
  }
  return html;
}

  var mathStore=[];
  function extractMath(src){
    mathStore=[];
    var parts=src.split(/(```[\s\S]*?```|~~~[\s\S]*?~~~)/);
    for(var i=0;i<parts.length;i++){
      if(i%2===1)continue; /* fenced code stays untouched */
      parts[i]=parts[i].replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g,function(m){
        mathStore.push(m);
        return '\uE000M'+(mathStore.length-1)+'\uE001';
      });
    }
    return parts.join('');
  }
  function restoreMath(root){
    if(!window.katex){
      /* katex.min.js 仍在下载：轮询等待后整体重渲染，绝不静默放弃 */
      if(!restoreMath._waiting){
        restoreMath._waiting=true;
        var t0=Date.now();
        var iv=setInterval(function(){
          if(window.katex){clearInterval(iv);restoreMath._waiting=false;render();}
          else if(Date.now()-t0>10000){clearInterval(iv);restoreMath._waiting=false;}
        },150);
      }
      return;
    }
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
    while((n=walker.nextNode()))nodes.push(n);
    nodes.forEach(function(node){
      if(node.nodeValue.indexOf('\uE000M')<0)return;
      var frag=document.createDocumentFragment();
      node.nodeValue.split(/(\uE000M\d+\uE001)/).forEach(function(p){
        var mm=p.match(/^\uE000M(\d+)\uE001$/);
        if(mm){
          var tex=mathStore[+mm[1]]||'';
          var disp=/^\$\$/.test(tex);
          var body=tex.replace(/^\$\$/,'').replace(/\$\$$/,'').replace(/^\$/,'').replace(/\$$/,'');
          var el=document.createElement(disp?'div':'span');
          el.className=disp?'md-math-block':'md-math-inline';
          try{katex.render(body,el,{displayMode:disp,throwOnError:false,output:'html'});}
          catch(e){el.textContent=tex;}
          frag.appendChild(el);
        }else if(p){frag.appendChild(document.createTextNode(p));}
      });
      node.parentNode.replaceChild(frag,node);
    });
  }
  function fixLocalImages(root){
    /* http 页面无法加载本地磁盘图片，统一转 /img 代理。
       支持：盘符绝对路径、file:///、相对路径（相对当前 md 文件所在目录；
       默认文档无当前文件时，相对路径交给后端按工具目录兜底解析） */
    var imgs=root.querySelectorAll('img');
    var base=currentFile?String(currentFile).replace(/[\\/][^\\/]*$/,''):'';
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src')||'';
      if(s.indexOf('/img?path=')===0)continue;
      if(/^https?:\/\//i.test(s))continue;
      if(/^data:/i.test(s))continue;
      if(s.charAt(0)==='/')continue;
      var raw=null;
      if(/^[A-Za-z]:[\\/]/.test(s)) raw=s;
      else if(/^file:\/\/\//i.test(s)) raw=s.replace(/^file:\/\/\//i,'');
      else raw=base?base+'/'+s:s;
      if(raw!==null) imgs[i].setAttribute('src','/img?path='+encodeURIComponent(raw));
    }
  }
  function splitBlocks(src){
    /* fence 感知的 H1/H2 分块：长文档按章切块做增量渲染 */
    var lines=src.split('\n'), blocks=[], cur=[], fence=false;
    for(var i=0;i<lines.length;i++){
      var ln=lines[i];
      if(/^\s*(```|~~~)/.test(ln)) fence=!fence;
      if(!fence && /^#{1,2} /.test(ln) && cur.length){ blocks.push(cur.join('\n')); cur=[]; }
      cur.push(ln);
    }
    if(cur.length) blocks.push(cur.join('\n'));
    return blocks;
  }
  function blkHash(s){
    var h=5381;
    for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
    return 'h'+h.toString(36);
  }
  var renderQueue=null;
  function render(){
    var src=extractMath(editor.value);
    var blocks=splitBlocks(src);
    var existing=preview.querySelectorAll('.pblk');
    if(existing.length===0 && preview.innerHTML.trim()!==''){ preview.innerHTML=''; }
    var changed=[];
    for(var i=0;i<blocks.length;i++){
      var node=existing[i];
      if(node && node.getAttribute('data-h')===blkHash(blocks[i])) continue;
      changed.push(i);
    }
    for(var j=blocks.length;j<existing.length;j++){
      var dead=existing[j];
      dead.parentNode.removeChild(dead);
    }
    if(renderQueue){ clearTimeout(renderQueue.t); renderQueue=null; }
    var q={changed:changed, blocks:blocks, existing:existing, idx:0};
    renderQueue=q;
    q.t=setTimeout(function step(){
      if(!renderQueue || renderQueue!==q) return;
      var bi=q.changed[q.idx];
      if(bi===undefined){ renderQueue=null; buildOutline(); return; }
      q.idx++;
      var div=q.existing[bi];
      var fresh=false;
      if(!div){ div=document.createElement('div'); div.className='pblk'; fresh=true; }
      div.setAttribute('data-h', blkHash(q.blocks[bi]));
      div.innerHTML=parseMarkdown(q.blocks[bi]);
      restoreMath(div); fixLocalImages(div);
      if(fresh){
        var next=q.existing[bi+1];
        preview.insertBefore(div, next||null);
      }
      renderQueue.t=setTimeout(step,0);
    },0);
  }
  function buildOutline(){
    var lines=editor.value.split('\n');
    var items=[];
    for(var i=0;i<lines.length;i++){
      var m=lines[i].match(/^(#{1,6})[ ]+(.*)$/);
      if(m){items.push({lvl:m[1].length,text:m[2].trim(),line:i});}
    }
    if(items.length===0){outlineEl.innerHTML='<h4>大纲</h4><div class="ol-item" style="color:var(--muted)">暂无标题</div>';return;}
    var html='<h4>大纲</h4>';
    for(var j=0;j<items.length;j++){
      var it=items[j];
      if(it.lvl>3) continue;
      html+='<div class="ol-item lvl-'+it.lvl+'" data-line="'+it.line+'">'+escapeHtml(it.text)+'</div>';
    }
    outlineEl.innerHTML=html;
    var ols=outlineEl.querySelectorAll('.ol-item[data-line]');
    for(var k=0;k<ols.length;k++){
      ols[k].addEventListener('click',function(){
        var ln=parseInt(this.getAttribute('data-line'),10);

        var ls=editor.value.split('\n');
        for(var p=0;p<ln;p++){pos+=ls[p].length+1;}
        editor.focus();
        editor.selectionStart=editor.selectionEnd=pos;
        var lineH=parseFloat(getComputedStyle(editor).lineHeight)||20;
        editor.scrollTop=Math.max(0,(ln-2)*lineH);
      });
    }
  }

  function applyFormat(d){
    var s=editor.selectionStart,e=editor.selectionEnd;
    var val=editor.value;
    var sel=val.substring(s,e);
    if(d.wrap){
      var text=sel||d.ph;
      var rep=d.pre+text+d.post;
      editor.value=val.substring(0,s)+rep+val.substring(e);
      var np=s+d.pre.length;
      editor.selectionStart=np;
      editor.selectionEnd=np+text.length;
    } else if(d.label==='链接'){
      var t=sel||d.ph;
      var rep=d.pre+t+d.post;
      editor.value=val.substring(0,s)+rep+val.substring(e);
      editor.selectionStart=s+1;
      editor.selectionEnd=s+1+t.length;
    } else if(d.label==='表格'){
      editor.value=val.substring(0,s)+d.pre+val.substring(e);
      editor.selectionStart=editor.selectionEnd=s+d.pre.length;
    } else {
      var before=val.substring(0,s);
      var after=val.substring(e);
      var lineStart=before.lastIndexOf('\n')+1;
      var rep2=d.pre+val.substring(lineStart,e);
      editor.value=val.substring(0,lineStart)+rep2+after;
      editor.selectionStart=lineStart;
      editor.selectionEnd=lineStart+rep2.length;
    }
    editor.focus();
    scheduleRender();scheduleSave();
  }

      o.value="'"+fams[i].replace(/'/g,"\\'")+"',sans-serif";
      g.appendChild(o);
    }
    sel.appendChild(g);
  }
  function tsFill(){
    var sels=document.querySelectorAll('select[data-ts]');
    for(var i=0;i<sels.length;i++){
      var s=sels[i];
      if(s.options.length===0)fillSel(s,FONT_VALS,FONT_OPTS);
    }
    var alns=document.querySelectorAll('select[data-algn]');
    for(var a=0;a<alns.length;a++){
      var t=alns[a];
      if(t.options.length===0)fillSel(t,ALGN_VALS,ALGN_LBLS);
    }
    var inds=document.querySelectorAll('select[data-ind]');
    for(var m=0;m<inds.length;m++){
      var u=inds[m];
      if(u.options.length===0)fillSel(u,IND_VALS,IND_LBLS);
    }
    var cached=null;try{cached=JSON.parse(localStorage.getItem(SYS_KEY)||'null');}catch(e){}
    if(cached&&cached.length){
      for(var k=0;k<sels.length;k++)addFontGroup(sels[k],cached);
    }
  }
  function tsOpen(){
    document.getElementById('tsAuto').value=tsCfg.autoSaveMin;
    var sels=document.querySelectorAll('select[data-ts]');
    var szs=document.querySelectorAll('input[data-tssz]');
    var als=document.querySelectorAll('select[data-algn]');
    for(var i=0;i<sels.length;i++){sels[i].value=tsCfg.fonts[sels[i].getAttribute('data-ts')].f||'';}
    for(var j=0;j<szs.length;j++){szs[j].value=tsCfg.fonts[szs[j].getAttribute('data-tssz')].s||'';}
    for(var a=0;a<als.length;a++){als[a].value=tsCfg.fonts[als[a].getAttribute('data-algn')].a||'';}
    var inds=document.querySelectorAll('select[data-ind]');
    var ics=document.querySelectorAll('input[data-indchars]');
    for(var b=0;b<inds.length;b++){var k1=inds[b].getAttribute('data-ind');inds[b].value=tsCfg.indent[k1].mode;}
    for(var c=0;c<ics.length;c++){var k2=ics[c].getAttribute('data-indchars');ics[c].value=tsCfg.indent[k2].chars;}
    document.getElementById('tsThree').checked=!!tsCfg.table.three;
    document.getElementById('tsHeadOn').checked=!!tsCfg.table.headOn;
    document.getElementById('tsHeadColor').value=tsCfg.table.headColor;
    document.getElementById('tsColOn').checked=!!tsCfg.table.colOn;
    document.getElementById('tsColColor').value=tsCfg.table.colColor;
    var pg=tsCfg.page;
    document.getElementById('tsPaper').value=pg.paper;
    document.getElementById('tsCustomRow').hidden=(pg.paper!=='custom');
    document.getElementById('tsPw').value=pg.pw;document.getElementById('tsPh').value=pg.ph;
    document.getElementById('tsMt').value=pg.mt;document.getElementById('tsMr').value=pg.mr;
    document.getElementById('tsMb').value=pg.mb;document.getElementById('tsMl').value=pg.ml;
    document.getElementById('tsPnOn').value=pg.pn.on;document.getElementById('tsPnPos').value=pg.pn.pos;
    document.getElementById('tsPnTpl').value=pg.pn.tpl;document.getElementById('tsPnSize').value=pg.pn.size;
    document.getElementById('tsTocOn').value=pg.toc.on;document.getElementById('tsTocPos').value=pg.toc.pos;
    document.getElementById('tsTocSolo').checked=!!pg.toc.solo;
    document.getElementById('tsOverlay').hidden=false;
  }
  document.getElementById('btnTypeset').addEventListener('click',tsOpen);
  document.getElementById('tsClose').addEventListener('click',function(){document.getElementById('tsOverlay').hidden=true;});
  document.getElementById('tsOverlay').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});
  /* ── 内嵌模式检测（pywebview 直连 py API；否则走 HTTP）───────────────── */
  var HAS_PY = false;
  window.addEventListener('pywebviewready', function(){
    HAS_PY = true;
    try { var a = pyApi(); if (a && a.api_version) a.api_version(); } catch(e) {}
  });
  function pyApi(){
    return (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
  }
  function pyReady(){
    var a = pyApi();
    return !!(a && a.pick_folder);
  }
  /* ── 新建 / 另存为 / 粘贴图片 ─────────────────────────── */
  var lastDir = '';
  try { lastDir = localStorage.getItem('md-lastdir') || ''; } catch(e) {}
  function updateSaveBtn(){
    var sb = document.getElementById('btnSave');
    var has = !!currentFile;
    sb.disabled = !has;
    sb.style.opacity = has ? '1' : '.45';
    sb.title = has ? '保存到 ' + currentFile : '尚无文件路径，请先「另存为」';
    if (!has) {
      var ss = document.getElementById('statSave');
      ss.textContent = '未另存为';
      ss.className = '';
    }
  }
  function newDoc(){
    currentFile = null; currentBuiltin = -1;
    editor.value = '';
    dirty = false;
    render();
    updateFileIndicator('未命名.md');
    updateSaveBtn();
    editor.focus();
  }
  document.getElementById('btnNew').addEventListener('click', newDoc);
  document.getElementById('btnSaveAs').addEventListener('click', openSaveAs);
  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey||e.metaKey) && (e.key==='n'||e.key==='N')){
      e.preventDefault(); newDoc();
    }
  });
  var quickDirs = null;
  function fillQuickDirs(){
    if (quickDirs) return;
    var __a = pyApi();
    var __p;
    if (pyReady() && __a.common_dirs) {
      __p = __a.common_dirs().then(function(d){ return {ok: true, dirs: d}; });
    } else {
      __p = fetch('/api/common-dirs').then(function(r){return r.json();});
    }
    Promise.resolve(__p).then(function(j){
      if (!(j && j.ok)) return;
      quickDirs = j.dirs || {};
      var box = document.getElementById('svQuick');
      box.innerHTML = '';
      var labels = {docs:'文档', desktop:'桌面', downloads:'下载', home:'用户目录'};
      Object.keys(labels).forEach(function(k){
        if (!quickDirs[k]) return;
        var el = document.createElement('div');
        el.className = 'sv-mini';
        el.textContent = labels[k];
        el.addEventListener('click', function(){ document.getElementById('svDir').value = quickDirs[k]; });
        box.appendChild(el);
      });
      var lb = document.createElement('div');
      lb.className = 'sv-mini';
      lb.textContent = '上次目录';
      lb.addEventListener('click', function(){ if (lastDir) document.getElementById('svDir').value = lastDir; });
      box.appendChild(lb);
    }).catch(function(){});
  }
  function docTitleForSave(){
    // 默认文件名取文档第一个一级标题（# 标题）；没有则“未命名.md”
    try {
      var m = (editor.value || '').match(/^[ \t]*#[ \t]+(.+?)[ \t]*$/m);
      var t = m ? m[1] : '';
      t = t.replace(/[\\\/:*?"<>|]/g, '').replace(/[ \t]+/g, ' ').trim();
      t = t.slice(0, 60);
      if (t) return t + '.md';
    } catch(e) {}
    return '未命名.md';
  }
  function openSaveAs(){
    var cur = docTitleForSave();
    if (currentFile) {
      var parts = currentFile.split(/[\\/]/);
      cur = parts[parts.length - 1] || cur;
    }
    doSaveAs(cur || docTitleForSave(), editor.value, function(path){
      currentFile = path;
      var base = path.split(/[\\/]/).pop();
      lastDir = path.replace(/[\\/][^\\/]*$/, '');
      try { localStorage.setItem('md-lastdir', lastDir); } catch(e) {}
      updateFileIndicator(base || '未命名.md');
      document.getElementById('statSave').textContent = '已保存';
      document.getElementById('statSave').className = 'saved';
      dirty = false;
      updateSaveBtn();
    });
  }
  document.getElementById('svCancel').addEventListener('click',function(){
    document.getElementById('svOverlay').hidden = true;
  });
  function doBrowseDir(){
    var a = pyApi();
    if (pyReady()) {
      a.pick_folder(lastDir).then(function(d){
        if (d) document.getElementById('svDir').value = d;
      }).catch(function(){});
      return;
    }
    fetch('/api/browse-dir').then(function(r){return r.json();}).then(function(j){
      if (j && j.ok && j.dir) document.getElementById('svDir').value = j.dir;
    }).catch(function(){});
  }
  document.getElementById('svBrowse').addEventListener('click', doBrowseDir);
  function doSaveAs(defaultName, content, onDone){
    var a = pyApi();
    if (pyReady() && a.save_as) {
      a.save_as(defaultName, content, lastDir).then(function(r){
        if (r && r.ok) { onDone(r.path); return; }
        if (r && r.cancelled) { return; }
        showToast('保存失败：' + ((r && r.error) || '未知错误'));
      }).catch(function(e){ showToast('保存失败：' + e); });
      return;
    }
    // 浏览器模式：打开保存模态框
    document.getElementById('svName').value = defaultName || '未命名.md';
    document.getElementById('svDir').value = lastDir;
    document.getElementById('svOverlay').hidden = false;
    fillQuickDirs();
  }
  document.getElementById('svGo').addEventListener('click',function(){
    var dir = document.getElementById('svDir').value.trim();
    if (!dir) { showToast('请先选择保存目录（点「浏览…」）'); return; }
    var name = document.getElementById('svName').value.trim() || '未命名.md';
    fetch('/api/save-as',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({dir:dir,name:name,content:editor.value})})
      .then(function(r){return r.json();})
      .then(function(j){
        if (!(j && j.ok)) { showToast('保存失败：'+((j&&j.error)||'未知错误')); return; }
        currentFile = j.path;
        lastDir = dir;
        setDraft(currentFile,undefined);
        try { localStorage.setItem('md-lastdir', lastDir); } catch(e) {}
        document.getElementById('svOverlay').hidden = true;
        updateFileIndicator(name);
        document.getElementById('statSave').textContent = '已保存';
        dirty = false;
        updateSaveBtn();
      }).catch(function(e){ showToast('保存失败：'+e.message); });
  });
  editor.addEventListener('paste', function(e){
    var items = (e.clipboardData || window.clipboardData).items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) {
        e.preventDefault();
        if (!currentFile) {
          showToast('粘贴图片前请先保存文档（Ctrl+S），图片将存入同名 .assets 目录。');
          openSaveAs();
          return;
        }
        var blob = items[i].getAsFile();
        var fr = new FileReader();
        fr.onload = function(){
          var __a = pyApi(), __p;
          if (pyReady() && __a.paste_image) {
            __p = __a.paste_image(currentFile, fr.result);
          } else {
            __p = fetch('/api/paste-image',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({docPath:currentFile,dataUrl:fr.result})}).then(function(r){return r.json();});
          }
          Promise.resolve(__p)
            .then(function(j){
              if (j && j.ok) {
                var ins = '![](' + j.rel + ')';
                var pos = editor.selectionStart || editor.value.length;
                editor.value = editor.value.slice(0,pos) + ins + editor.value.slice(editor.selectionEnd || pos);
                editor.selectionStart = editor.selectionEnd = pos + ins.length;
                editor.dispatchEvent(new Event('input'));
              } else { showToast('图片保存失败：'+((j&&j.error)||'未知错误')); }
            }).catch(function(er){ showToast('图片保存失败：'+er.message); });
        };
        fr.readAsDataURL(blob);
        return;
      }
    }
  });

  function fillServerFonts(){
    try{
      fetch('/api/fonts').then(function(r){return r.json();}).then(function(j){
        if(!(j&&j.ok&&j.fonts&&j.fonts.length))return;
        try{localStorage.setItem(SYS_KEY,JSON.stringify(j.fonts));}catch(e){}
        var sels=document.querySelectorAll('select[data-ts]');
        for(var i=0;i<sels.length;i++){
          var gs=sels[i].querySelectorAll('optgroup');
          for(var k=0;k<gs.length;k++)gs[k].parentNode.removeChild(gs[k]);
          addFontGroup(sels[i],j.fonts);
        }
      }).catch(function(){});
    }catch(e){}
  }
  fillServerFonts();
  document.getElementById('tsPaper').addEventListener('change',function(){
    document.getElementById('tsCustomRow').hidden=(this.value!=='custom');
  });
  document.getElementById('tsApply').addEventListener('click',function(){
    tsCfg.autoSaveMin=Math.max(0,Math.min(60,parseInt(document.getElementById('tsAuto').value,10)||0));
    var sels=document.querySelectorAll('select[data-ts]');
    var szs=document.querySelectorAll('input[data-tssz]');
    var als=document.querySelectorAll('select[data-algn]');
    for(var i=0;i<sels.length;i++){tsCfg.fonts[sels[i].getAttribute('data-ts')].f=sels[i].value;}
    for(var j=0;j<szs.length;j++){var v=parseFloat(szs[j].value);tsCfg.fonts[szs[j].getAttribute('data-tssz')].s=isNaN(v)?'':v;}
    for(var a=0;a<als.length;a++){tsCfg.fonts[als[a].getAttribute('data-algn')].a=als[a].value;}
    var inds=document.querySelectorAll('select[data-ind]');
    var ics=document.querySelectorAll('input[data-indchars]');
    for(var b=0;b<inds.length;b++){
      var k1=inds[b].getAttribute('data-ind');
      var m=inds[b].value;if(m!=='none'&&m!=='first'&&m!=='hang')m='none';
      tsCfg.indent[k1].mode=m;
    }
    for(var c=0;c<ics.length;c++){
      var k2=ics[c].getAttribute('data-indchars');
      var iv=parseFloat(ics[c].value);tsCfg.indent[k2].chars=isNaN(iv)?2:Math.max(0,Math.min(8,iv));
    }
    tsCfg.table.three=document.getElementById('tsThree').checked;
    tsCfg.table.headOn=document.getElementById('tsHeadOn').checked;
    tsCfg.table.headColor=document.getElementById('tsHeadColor').value;
    tsCfg.table.colOn=document.getElementById('tsColOn').checked;
    tsCfg.table.colColor=document.getElementById('tsColColor').value;
    var pg=tsCfg.page;
    pg.paper=document.getElementById('tsPaper').value;
    pg.pw=document.getElementById('tsPw').value;pg.ph=document.getElementById('tsPh').value;
    pg.mt=parseFloat(document.getElementById('tsMt').value)||0;pg.mr=parseFloat(document.getElementById('tsMr').value)||0;
    pg.mb=parseFloat(document.getElementById('tsMb').value)||0;pg.ml=parseFloat(document.getElementById('tsMl').value)||0;
    pg.pn.on=document.getElementById('tsPnOn').value;pg.pn.pos=document.getElementById('tsPnPos').value;
    pg.pn.tpl=document.getElementById('tsPnTpl').value||'第 {p} 页';
    pg.pn.size=parseFloat(document.getElementById('tsPnSize').value)||9;
    pg.toc.on=document.getElementById('tsTocOn').value;pg.toc.pos=document.getElementById('tsTocPos').value;
    pg.toc.solo=document.getElementById('tsTocSolo').checked;
    applyTypeset();resetAutoDisk();
    document.getElementById('tsOverlay').hidden=true;
    var ss=document.getElementById('statSave');ss.textContent='排版已更新（缓存）';ss.className='saved';
  });
  var dirty=false,diskTimer=null;
  editor.addEventListener('input',function(){dirty=true;});
  function diskNow(){
    if(!dirty)return;
    if(!currentFile){ openSaveAs(); return; }
    fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:currentFile,content:editor.value})})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.ok){dirty=false;
          setDraft(currentFile,undefined);
          var ss=document.getElementById('statSave');
          ss.textContent='已落盘 '+new Date().toLocaleTimeString();ss.className='saved';
        }
      }).catch(function(){});
  }
  function resetAutoDisk(){
    if(diskTimer)clearInterval(diskTimer);
    diskTimer=null;
    if(tsCfg.autoSaveMin>0){diskTimer=setInterval(function(){if(dirty)diskNow();},tsCfg.autoSaveMin*60000);}
  }
  tsFill();applyTypeset();resetAutoDisk();

  /* ---- build self-check: hard-reload once when the served HTML changes ---- */
  (function(){
    var b=document.body.getAttribute('data-build');
    if(!b)return;
    var seen=null,reloaded=false;
    try{
      seen=sessionStorage.getItem('md-build-seen');
      reloaded=sessionStorage.getItem('md-build-reloaded')==='1';
    }catch(e){}
    if(seen&&seen!==b&&!reloaded){
      try{sessionStorage.setItem('md-build-reloaded','1');}catch(e){}
      location.reload();
      return;
    }
    try{
      sessionStorage.setItem('md-build-seen',b);
      if(seen===b)sessionStorage.removeItem('md-build-reloaded');
    }catch(e){}
  })();

  /* ---- recent files manager ---- */
  var RECENT_KEY='md-editor-recent';
  function recentList(){
    try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}
  }
  function addRecent(p, name){
    var list=recentList();
    var path=p||null;
    var nm=name||String(p).replace(/^.*[\\/]/,'')||'(未命名)';
    list=list.filter(function(r){ return r.path ? (r.path!==path) : (r.name!==nm); });
    list.unshift({path:path,name:nm,time:Date.now()});
    if(list.length>12)list.length=12;
    try{localStorage.setItem(RECENT_KEY,JSON.stringify(list));}catch(e){}
  }
  function updateFileIndicator(p){
    var name=p?String(p).replace(/^.*[\\/]/,''):'默认文档';
    document.getElementById('statFile').textContent=name;
    document.title=(name==='默认文档')?'MDEditor':'MDEditor - '+name;
  }
  function loadFile(p){
    currentBuiltin=-1;
    fetch('/api/file?path='+encodeURIComponent(p))
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
      .then(function(txt){
        currentFile=p;
        applyDocWithDraft(p, txt, '已载入');
        addRecent(p);
        updateFileIndicator(p);
      })
      .catch(function(e){ showToast('读取文件失败：'+e.message); });
  }
  var currentBuiltin=-1;
  function loadBuiltin(idx){
    if(idx<0||idx>=BUILTIN_DOCS.length)return;
    var d=BUILTIN_DOCS[idx];
    if(!d.file){ return; }
    fetch('/doc?file='+encodeURIComponent(d.file))
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j||!j.ok){ showToast('载入内置文档失败：'+((j&&j.error)||'未知错误')); return; }
        currentFile=j.path;          /* 实体文件路径：保存直接落盘，不弹窗 */
        currentBuiltin=idx;
        applyDocWithDraft(j.path, j.content, '已保存');
        updateFileIndicator(d.name);
        updateSaveBtn();
        addRecent(j.path, d.name);
      })
      .catch(function(e){ showToast('载入内置文档失败：'+e.message); });
  }
  function loadDefault(){
    loadBuiltin(0);   /* 默认文档 = 使用指南（实体文件） */
  }
  function renderFileList(){
    var el=document.getElementById('fmList');
    var rec=recentList();
    var html='<div class="fm-sub" style="padding:2px 4px 6px;font-weight:600;">内置文档</div>';
    for(var b=0;b<BUILTIN_DOCS.length;b++){
      var cur=(currentBuiltin===b)?' cur':'';
      html+='<div class="fm-item'+cur+'" data-builtin="'+b+'"><b>'+BUILTIN_DOCS[b].name+'</b><div class="fm-sub">内置文档 · 点击载入（可编辑/另存为）</div></div>';
    }
    html+='<div class="fm-sub" style="padding:8px 4px 6px;font-weight:600;">最近文件</div>';
    html+='<div class="fm-item" data-act="default"><b>默认文档（使用指南）</b><div class="fm-sub">回到初始示例状态</div></div>';
    for(var i=0;i<rec.length;i++){
      var r=rec[i];
      var cur=(r.path&&r.path===currentFile)?' cur':'';
      var sub=r.path?escapeHtml(r.path):'通过「打开」按钮选择（浏览器不提供完整路径）';
      html+='<div class="fm-item'+cur+'" data-i="'+i+'"><b>'+escapeHtml(r.name)+'</b><div class="fm-sub">'+sub+' · '+new Date(r.time).toLocaleString()+'</div></div>';
    }
    if(rec.length===0){
      html+='<div class="fm-sub" style="padding:10px 4px;">暂无最近文件。通过右键菜单打开 .md，或用「打开」按钮选择后，会自动记录在这里。</div>';
    }
    el.innerHTML=html;
    var items=el.querySelectorAll('.fm-item');
    for(var k=0;k<items.length;k++){
      items[k].addEventListener('click',function(){
        var act=this.getAttribute('data-act');
        var bi=this.getAttribute('data-builtin');
        document.getElementById('fmOverlay').hidden=true;
        if(bi!==null&&bi!==undefined&&bi!==''){loadBuiltin(parseInt(bi,10));return;}
        if(act==='default'){loadDefault();return;}
        var idx=parseInt(this.getAttribute('data-i'),10);
        var r=recentList()[idx];
        if(!r)return;
        if(r.path){loadFile(r.path);}
        else{showToast('该文件通过「打开」按钮选择，浏览器不提供完整路径，无法自动重载。\n请通过右键菜单打开它，或再次用「打开」选择。');}
      });
    }
  }
  document.getElementById('btnFiles').addEventListener('click',function(){
    renderFileList();
    document.getElementById('fmOverlay').hidden=false;
  });
  document.getElementById('fmClose').addEventListener('click',function(){
    document.getElementById('fmOverlay').hidden=true;
  });
  document.getElementById('fmOverlay').addEventListener('click',function(e){
    if(e.target===this)this.hidden=true;
  });
  /* 初始文件指示：无 URL 时缓存内容对应最近一条记录 */
  (function(){
    var rec=recentList();
    updateFileIndicator(rec.length?rec[0].name:null);
  })();
  loadFromUrl();
})();
/*UI_END*/
</script>
